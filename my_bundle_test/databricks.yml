    default: true
    workspace:
      host: https://dbc-7589974a-c9d0.cloud.databricks.com?w=3755267878390796
    variables:
      catalog: my_catalog_dev
      schema: my_db
  prod:
    mode: production
    workspace:
      host: https://dbc-487ab213-fd90.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/rockyrams1998@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/zeroemotions1998@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: my_catalog_prd
      schema: my_db
    permissions:
      - user_name: zeroemotions1998@gmail.com
